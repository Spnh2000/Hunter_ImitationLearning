# slam_toolbox -- LOCALIZATION mode against a pre-built map.
#
# This is the configuration used for Phase 6 dataset collection. Localizing
# against a fixed serialized pose graph rather than re-running SLAM gives:
#   * an identical reference frame across every run, so episodes are
#     comparable and the map is not itself a source of run-to-run variance
#   * no first-lap warm-up, where a from-scratch map is at its worst exactly
#     when the robot is generating training data
#   * lower CPU, leaving headroom for the control loop
#
# map_file_name is set from the launch file (localization.launch.py's
# map_file argument), defaulting to the pose graph produced in Phase 5.
# Note slam_toolbox expects the path WITHOUT the .posegraph extension.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: localization

    # Start localized at the map origin, which is where the pose graph was
    # begun -- the same spawn pose the benchmark launch computes from the
    # track CSV's first waypoint. If the robot is ever spawned elsewhere,
    # seed instead with /initialpose.
    map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    # 0.02, NOT 0.0. slam_toolbox's own config documents "if 0 never
    # publishes odometry": the same timer drives BOTH the map->odom TF and
    # /slam_toolbox/pose. Setting it to 0 to stop the TF also silences the
    # pose, leaving the global EKF with no absolute measurement -- it would
    # then propagate on wheel odometry alone and 'SLAM' would silently be
    # dead reckoning. So slam_toolbox owns the map->odom TF, and the global
    # EKF runs with publish_tf:false (see ekf_global.yaml).
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 30.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.2

    # Rolling window of recent scans matched against the stored graph.
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 30.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 3.0

    # Loop closure stays on: in localization mode this is what re-anchors the
    # robot to the stored graph each lap. Thresholds match mapping mode so
    # that a match accepted while localizing is one that would also have been
    # accepted while mapping.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.40
    loop_match_minimum_response_fine: 0.60

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
