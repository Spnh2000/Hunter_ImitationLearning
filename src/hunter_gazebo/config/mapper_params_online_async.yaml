slam_toolbox:
  ros__parameters:
    # ── Basic ROS 2 Frames & Topics ──
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # ── Map Configuration ──
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 10.0
    stack_size_to_use: 40000000

    # ── Ackermann Tuning ──
    # Fast-moving cars need frequent map updates even with small angular changes,
    # and larger travel distances to avoid smearing the map on straights.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1

    # Loop closure and mapping optimizations
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
