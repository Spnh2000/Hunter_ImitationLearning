hunter_controller_node:
  ros__parameters:
    # ── Controller selection ──────────────────────────────────────────────────
    controller_type: "pure_pursuit"   # pure_pursuit | stanley | lqr | mpc

    # ── Robot ─────────────────────────────────────────────────────────────────
    wheelbase: 0.648        # Hunter V2 wheelbase [m]
    max_speed: 1.0          # hard cap applied to waypoint speeds [m/s]
    min_speed: 0.2          # minimum speed passed to planners [m/s]
    max_steer: 0.52         # Hunter V2 max front-wheel angle [rad]
    vgain: 1.0              # speed multiplier (applied by planner)
    control_freq: 20.0      # control loop rate [Hz]

    # ── Waypoints ─────────────────────────────────────────────────────────────
    waypoint_file: ""       # set via launch arg; e.g. "Monza_baseline.csv"

    # ── Pure Pursuit ──────────────────────────────────────────────────────────
    lookahead_distance: 1.0   # m — minimum lookahead (floor when adaptive)

    # ── Stanley ───────────────────────────────────────────────────────────────
    k_path: 5.0               # cross-track error gain

    # ── LQR ───────────────────────────────────────────────────────────────────
    lqr_timestep: 0.05        # discretisation step for A/B matrices [s]
