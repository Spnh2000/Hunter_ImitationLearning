trajectory_server:
  ros__parameters:
    path_format: auto
    frame_id: odom
    speed_source: curvature_limited
    max_speed_mps: 2.7
    min_speed_mps: 0.2
    lateral_accel_limit_mps2: 0.4
    close_loop_gap_threshold_m: 0.05
    centerline_smoothing_m: 2.8
    visualize: true
pid_tracker:
  ros__parameters:
    wheelbase_m: 0.65
    max_steering_rad: 0.461
    max_speed_mps: 2.7
    control_frequency_hz: 50.0
    heading_feedforward_gain: 1.0
    enable_curvature_feedforward: true
    curvature_preview_m: 0.3
    speed_preview_m: 2.5
    steering_pid.p: 1.3
    steering_pid.i: 0.04
    steering_pid.d: 0.25
    speed_pid.p: 0.5
    speed_pid.i: 0.3
    speed_pid.d: 0.0
